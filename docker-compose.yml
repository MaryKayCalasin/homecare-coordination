services:
  postgres:
    image: postgres:16-alpine
    container_name: homecare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: homecare
      POSTGRES_USER: homecare
      POSTGRES_PASSWORD: homecare_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homecare -d homecare"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homecare-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: homecare
      DB_USERNAME: homecare
      DB_PASSWORD: homecare_dev_password
      JWT_SECRET: change-this-secret-in-production-min-256-bits-long-please
      # Seeds the admin/nurse/patient demo accounts documented in the README on first
      # startup. Set to "false" (or remove) once you're pointing this compose file at
      # anything other than a throwaway local database.
      APP_SEED_ENABLED: "true"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
