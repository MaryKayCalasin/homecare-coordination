spring:
  application:
    name: homecare-coordination

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:homecare}
    username: ${DB_USERNAME:homecare}
    password: ${DB_PASSWORD:homecare_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway (below) is the single source of truth for schema changes; Hibernate only
      # validates that entity mappings match what Flyway has created, so a mismatch fails
      # fast at startup with a clear error instead of surfacing as a 500 on first use.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Europe/Oslo
    show-sql: false

  flyway:
    enabled: true
    # This project's tables were originally created by Hibernate's ddl-auto=update.
    # baseline-on-migrate lets Flyway adopt an already-existing, non-empty database:
    # on first run it records everything up to baseline-version as already applied
    # (V1 below is that historical snapshot) and only runs migrations after it.
    baseline-on-migrate: true
    baseline-version: 1

  jackson:
    time-zone: Europe/Oslo
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-please-override-in-production-min-256-bits}
    expiration-ms: 43200000 # 12 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  handover:
    shift-day-start: "07:00"
    shift-evening-start: "15:00"
    shift-night-start: "23:00"
  seed:
    enabled: ${APP_SEED_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    no.kommune.homecare: INFO
